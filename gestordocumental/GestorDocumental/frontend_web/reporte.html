<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Gestión Documental - Reporte Diario</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/buttons.css">
</head>

<body class="bg-gray-100 h-screen flex flex-col overflow-hidden text-xs">


    <header class="bg-slate-800 text-white h-10 flex items-center justify-between px-6">
        <div class="flex space-x-6">
            <span class="font-bold text-white border-b-2 border-indigo-400 pb-0.5 cursor-pointer">Contratos</span>

        </div>
        <div class="flex items-center space-x-4">
            <span class="text-gray-300 text-[11px]">Admin (Henry)</span>
            <div class="w-6 h-6 bg-indigo-600 rounded-full flex items-center justify-center font-bold text-xs">H</div>
        </div>
    </header>


    <div class="bg-white border-b border-gray-300 px-6 py-1.5 flex items-center justify-between text-[11px]">
        <div></div>
        <div class="flex space-x-2 items-center justify-end">
            <a href="index.html" class="boton-estandar cursor-pointer inline-block text-center no-underline">Regresar a
                Indexamiento</a>
        </div>
    </div>


    <div class="flex-1 flex overflow-hidden">



        <aside class="flex bg-white border-r border-gray-300 overflow-y-auto" id="nav-container">

        </aside>


        <main class="flex-1 bg-white flex flex-col p-6 overflow-auto">
            <div class="flex items-center justify-between pb-4 border-b border-gray-300 mb-4">
                <h2 class="text-base font-bold text-slate-800">Reporte Diario</h2>
                <div class="space-x-2">
                    <button id="btnEstructuraHycite"
                        class="bg-slate-800 text-white px-3 py-1 rounded text-xs hover:bg-slate-700 cursor-pointer">Generar
                        Estructura HYCITE</button>
                    <button id="btnExportarExcel"
                        class="bg-emerald-700 text-white px-3 py-1 rounded text-xs hover:bg-emerald-600 cursor-pointer">Generar
                        Excel Reporte Diario</button>
                </div>
            </div>

            <div class="flex items-center space-x-3 mb-4 text-xs">
                <label class="font-medium text-gray-700">Fecha De Procesamiento:</label>
                <input type="date" value="" class="px-2 py-1 border border-gray-300 rounded bg-white">
            </div>


            <div class="border border-gray-300 rounded overflow-x-auto flex-1 bg-white">
                <table class="w-full text-left border-collapse text-[11px]">
                    <thead>
                        <tr class="bg-slate-100 border-b border-gray-300 text-slate-700">
                            <th class="p-2 border-r">Fecha de Proceso</th>
                            <th class="p-2 border-r">Fecha de Contrato</th>
                            <th class="p-2 border-r">No. de Distribuidor</th>
                            <th class="p-2 border-r">No. de Folio</th>
                            <th class="p-2 border-r">Cliente</th>
                            <th class="p-2 border-r">Observaciones</th>
                            <th class="p-2 border-r">Carpeta</th>
                            <th class="p-2 border-r">Archivo</th>
                        </tr>
                    </thead>
                    <tbody id="tablaReportesBody">
                        <tr class="border-b border-gray-200 hover:bg-gray-50">
                            <td class="p-2 border-r"></td>
                            <td class="p-2 border-r"></td>
                            <td class="p-2 border-r"></td>
                            <td class="p-2 border-r"></td>
                            <td class="p-2 border-r"></td>
                            <td class="p-2 border-r"></td>
                            <td class="p-2 border-r"></td>
                            <td class="p-2"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

    </div>

    <script src="js/nav.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const tbody = document.getElementById("tablaReportesBody");
            if (!tbody) return;

            const registros = JSON.parse(localStorage.getItem("contratos_indexados")) || [];
            tbody.innerHTML = "";

            if (registros.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="p-4 text-center text-gray-500">No hay contratos indexados todavía.</td>
                    </tr>
                `;
                return;
            }

            registros.forEach((item) => {
                const fila = document.createElement("tr");
                fila.className = "border-b border-gray-200 hover:bg-gray-50 text-center";

                // Unificamos Folio + Cliente para la columna Archivo
                const folioStr = item.nroContrato || '';
                const clienteStr = item.nombreCliente || '';
                const archivoTexto = folioStr ? (folioStr + " " + clienteStr) : clienteStr;

                fila.innerHTML = `
                    <td class="p-2 border-r">${item.fechaProceso || ''}</td>
                    <td class="p-2 border-r">${item.fechaContrato || ''}</td>
                    <td class="p-2 border-r">${item.nroDistribuidor || ''}</td>
                    <td class="p-2 border-r">${folioStr}</td>
                    <td class="p-2 border-r">${clienteStr}</td>
                    <td class="p-2 border-r">${item.observaciones || item.obsHojas || ''}</td>
                    <td class="p-2 border-r"></td>
                    <td class="p-2">${archivoTexto}</td>
                `;
                tbody.appendChild(fila);
            });

            // 1. Botón: Generar Excel (.xls) con nombre dinámico: Folio + Cliente
            const btnExcel = document.getElementById("btnExportarExcel");
            if (btnExcel) {
                btnExcel.addEventListener("click", () => {
                    if (registros.length === 0) {
                        alert("⚠ No hay registros indexados para exportar.");
                        return;
                    }

                    let primerReg = registros[0];
                    let nombreDinamico = "reporte_diario_contratos";
                    if (primerReg && primerReg.nroContrato && primerReg.nombreCliente) {
                        nombreDinamico = primerReg.nroContrato + " " + primerReg.nombreCliente;
                    }

                    let tablaHtml = `
                        <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
                        <head>
                            <meta charset="utf-8">
                            <style>
                                th { background-color: #1e293b; color: #ffffff; font-weight: bold; text-align: center; border: 1px solid #000; padding: 8px; }
                                td { border: 1px solid #cccccc; padding: 6px; vertical-align: middle; mso-data-placement: same-cell; white-space: normal; }
                            </style>
                        </head>
                        <body>
                            <table>
                                <thead>
                                    <tr>
                                        <th>Fecha de Proceso</th>
                                        <th>Fecha de Contrato</th>
                                        <th>No. de Distribuidor</th>
                                        <th>No. de Contrato</th>
                                        <th>Cliente</th>
                                        <th>Observaciones</th>
                                        <th>Carpeta</th>
                                        <th>Archivo</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                    registros.forEach(r => {
                        let f = r.nroContrato || '';
                        let c = r.nombreCliente || '';
                        let arch = f ? (f + " " + c) : c;

                        tablaHtml += `
                            <tr>
                                <td style="text-align: center;">${r.fechaProceso || ''}</td>
                                <td style="text-align: center;">${r.fechaContrato || ''}</td>
                                <td style="text-align: center;">${r.nroDistribuidor || ''}</td>
                                <td style="text-align: center;">${f}</td>
                                <td>${c}</td>
                                <td>${r.observaciones || r.obsHojas || ''}</td>
                                <td></td>
                                <td>${arch}</td>
                            </tr>
                        `;
                    });

                    tablaHtml += `</tbody></table></body></html>`;

                    const blob = new Blob([tablaHtml], { type: "application/vnd.ms-excel;charset=utf-8;" });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement("a");
                    link.setAttribute("href", url);
                    link.setAttribute("download", nombreDinamico + ".xls");
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                });
            }

         const btnHycite = document.getElementById("btnEstructuraHycite");
            if (btnHycite) {
                btnHycite.addEventListener("click", () => {
                    const registros = JSON.parse(localStorage.getItem("contratos_indexados")) || [];
                    if (registros.length === 0) {
                        alert("⚠ No hay registros indexados para generar el documento.");
                        return;
                    }

                    let primerReg = registros[0];
                    let folio = primerReg.nroContrato || 'S/N';
                    let cliente = primerReg.nombreCliente || 'Cliente';
                    let nombreArchivoFinal = folio + " " + cliente;

                    // Buscamos el PDF directamente desde sessionStorage que viajó al indexar
                    let pdfUrl = sessionStorage.getItem("pdf_para_reporte") || primerReg.pdfUrl || primerReg.archivoPdf;

                    let ventanaImpresion = window.open('', '_blank');
                    let html = '<html lang="es"><head><meta charset="utf-8">';
                    html += '<title>' + nombreArchivoFinal + '</title>';
                    html += '<style>';
                    html += 'body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #525659; }';
                    html += '#visor-pdf { width: 100%; height: 100%; border: none; }';
                    html += '.barra-superior { position: absolute; top: 0; left: 0; right: 0; background: #1e293b; color: white; padding: 10px; font-family: Arial; font-size: 14px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }';
                    html += '.btn-guardar { background: #3b82f6; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }';
                    html += '</style></head><body>';

                    if (pdfUrl) {
                        html += '<div class="barra-superior">';
                        html += '<span><b>Documento:</b> ' + nombreArchivoFinal + '</span>';
                        html += '<button class="btn-guardar" onclick="window.print()">Imprimir / Guardar PDF</button>';
                        html += '</div>';
                        html += '<embed id="visor-pdf" src="' + pdfUrl + '#toolbar=1" type="application/pdf" />';
                    } else {
                        html += '<div style="color: white; text-align: center; margin-top: 100px; font-family: Arial;">';
                        html += '<h2>⚠ No se encontró el archivo PDF en la sesión</h2>';
                        html += '<p>Por favor indexa un documento primero.</p>';
                        html += '</div>';
                    }

                    html += '</body></html>';

                    ventanaImpresion.document.write(html);
                    ventanaImpresion.document.close();
                });
            }
        });
    </script>
 
</body>

</html>
