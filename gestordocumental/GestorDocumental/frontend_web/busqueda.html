<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Gestión Documental - Búsqueda</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/buttons.css">
</head>

<body class="bg-gray-100 h-screen flex flex-col overflow-hidden text-xs">

    <header class="bg-slate-800 text-white h-10 flex items-center justify-between px-6">
        <div class="flex space-x-6">
            <span class="font-bold text-white border-b-2 border-indigo-400 pb-0.5 cursor-pointer">Contratos</span>
        </div>
        <div class="flex items-center space-x-4">
            <span class="text-gray-300 text-[11px]">Admin (Henry)</span>
            <div class="w-6 h-6 bg-indigo-600 rounded-full flex items-center justify-center font-bold text-xs">H</div>
        </div>
    </header>

    <div class="bg-white border-b border-gray-300 px-6 py-1.5 flex items-center justify-between text-[11px]">
        <div></div>
        <div class="flex space-x-2 items-center justify-end">
            <a href="index.html" class="boton-estandar cursor-pointer inline-block text-center no-underline">Regresar a
                Indexamiento</a>
        </div>
    </div>

    <div class="flex-1 flex overflow-hidden">

        <aside class="flex bg-white border-r border-gray-300 overflow-y-auto" id="nav-container">
        </aside>

        <main class="flex-1 bg-white flex flex-col p-6 overflow-auto">
            <div class="flex items-center justify-between pb-4 border-b border-gray-300 mb-4">
                <h2 class="text-base font-bold text-slate-800">Búsqueda de Contratos</h2>
                <div class="space-x-2">
                    <button id="btnLimpiarBusqueda"
                        class="bg-slate-600 text-white px-3 py-1 rounded text-xs hover:bg-slate-500 cursor-pointer">Limpiar
                        Filtros</button>
                </div>
            </div>

            <!-- Barra de búsqueda rápida base -->
            <div
                class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4 text-xs bg-slate-50 p-3 rounded border border-gray-200">
                <div>
                    <label class="block font-medium text-gray-700 mb-1">Buscar por No. de Contrato / Folio:</label>
                    <input type="text" id="buscarFolio" placeholder="Ej. 1234"
                        class="w-full px-2 py-1 border border-gray-300 rounded bg-white">
                </div>
                <div>
                    <label class="block font-medium text-gray-700 mb-1">Buscar por Nombre de Cliente:</label>
                    <input type="text" id="buscarCliente" placeholder="Ej. HENRY"
                        class="w-full px-2 py-1 border border-gray-300 rounded bg-white">
                </div>
                <div>
                    <label class="block font-medium text-gray-700 mb-1">Buscar por Distribuidor:</label>
                    <input type="text" id="buscarDistribuidor" placeholder="Ej. 12345678"
                        class="w-full px-2 py-1 border border-gray-300 rounded bg-white">
                </div>
            </div>


            <div class="border border-gray-300 rounded overflow-x-auto flex-1 bg-white">
                <table class="w-full text-left border-collapse text-[11px]">
                    <thead>
                        <tr class="bg-slate-100 border-b border-gray-300 text-slate-700 text-center">
                            <th class="p-2 border-r">Fecha de Proceso</th>
                            <th class="p-2 border-r">Fecha de Contrato</th>
                            <th class="p-2 border-r">No. de Distribuidor</th>
                            <th class="p-2 border-r">No. de Contrato</th>
                            <th class="p-2 border-r">Cliente</th>
                            <th class="p-2 border-r">Empresa</th>
                            <th class="p-2 border-r">Observaciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaBusquedaBody">
                        <tr>
                            <td colspan="7" class="p-4 text-center text-gray-500">Cargando registros...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

    </div>

    <script src="js/nav.js"></script>
    <script src="js/busqueda.js"></script>
</body>

</html>
