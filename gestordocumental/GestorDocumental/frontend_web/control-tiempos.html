<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Gestión Documental - Control de Tiempos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/buttons.css">
</head>

<body class="bg-gray-100 h-screen flex flex-col overflow-hidden text-xs">


    <header class="bg-slate-800 text-white h-10 flex items-center justify-between px-6">
        <div class="flex space-x-6">
            <span class="font-bold text-white border-b-2 border-indigo-400 pb-0.5 cursor-pointer">Contratos</span>

        </div>
        <div class="flex items-center space-x-4">
            <span class="text-gray-300 text-[11px]">Admin (Henry)</span>
            <div class="w-6 h-6 bg-indigo-600 rounded-full flex items-center justify-center font-bold text-xs">H</div>
        </div>
    </header>


    <div class="bg-white border-b border-gray-300 px-6 py-1.5 flex items-center justify-between text-[11px]">
        <div></div>
        <div class="flex space-x-2 items-center justify-end">
            <a href="index.html" class="boton-estandar cursor-pointer inline-block text-center no-underline">Regresar a
                Indexamiento</a>
        </div>
    </div>


    <div class="flex-1 flex overflow-hidden">



        <aside class="flex bg-white border-r border-gray-300 overflow-y-auto" id="nav-container">

        </aside>


        <main class="flex-1 bg-white flex flex-col p-6 overflow-auto">
            <div class="flex items-center justify-between pb-4 border-b border-gray-300 mb-4">
                <h2 class="text-base font-bold text-slate-800">Control de Tiempos y Producción</h2>
                <div class="space-x-2">
                    <button id="btnExportarExcel"
                        class="bg-emerald-700 text-white px-3 py-1 rounded text-xs hover:bg-emerald-600 cursor-pointer">Exportar
                        Excel Control Tiempos</button>
                </div>
            </div>


            <div class="border border-gray-300 rounded overflow-x-auto flex-1 bg-white">
                <table class="w-full text-left border-collapse text-[11px]">
                    <thead>
                        <tr class="bg-slate-100 border-b border-gray-300 text-slate-700 text-center">
                            <th class="p-2 border-r">FECHA / TURNO</th>
                            <th class="p-2 border-r">CANTIDAD</th>
                            <th class="p-2 border-r">HORA INICIO</th>
                            <th class="p-2 border-r">HORA FIN</th>
                            <th class="p-2 border-r">CANTIDAD</th>
                            <th class="p-2 border-r">HORA INICIO</th>
                            <th class="p-2 border-r">HORA FIN</th>
                            <th class="p-2 border-r">HORAS POR...</th>
                            <th class="p-2 border-r">HORAS POR...</th>
                            <th class="p-2">TOTAL HORA </th>
                        </tr>
                    </thead>
                    <tbody id="tablaTiemposBody">
                        <tr class="border-b border-gray-200 hover:bg-gray-50 text-center">
                            <td colspan="10" class="p-4 text-center text-gray-500">Cargando registros de producción...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

    </div>


    <script src="js/nav.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const tbody = document.getElementById("tablaTiemposBody");
            if (!tbody) return;

            const cortes = JSON.parse(localStorage.getItem("control_tiempos")) || [];
            tbody.innerHTML = "";

            if (cortes.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="10" class="p-4 text-center text-gray-500">No hay cortes registrados todavía. Comience a indexar contratos.</td>
                    </tr>
                `;
                return;
            }


            let registrosPorFecha = {};

            cortes.forEach(corte => {
                let fechaLimpia = corte.fechaTurno ? corte.fechaTurno.split(' - ')[0] : "16/11/2026";
                let turno = corte.turno || (corte.fechaTurno && corte.fechaTurno.includes('PM') ? 'PM' : 'AM');

                if (!registrosPorFecha[fechaLimpia]) {
                    registrosPorFecha[fechaLimpia] = { am: 0, pm: 0, folios: 0 };
                }

                if (turno === 'AM') {
                    registrosPorFecha[fechaLimpia].am += (corte.totalContratos || 1);
                } else {
                    registrosPorFecha[fechaLimpia].pm += (corte.totalContratos || 1);
                }
                registrosPorFecha[fechaLimpia].folios += (corte.cantidadFolios || 1);
            });

            tbody.innerHTML = "";


            Object.keys(registrosPorFecha).forEach(fecha => {
                let datos = registrosPorFecha[fecha];

                let cantidadPm = datos.pm > 0 ? datos.pm : (datos.am > 1 ? datos.am : 1);
                let totalSuma = 1 + cantidadPm;

                const fila = document.createElement("tr");
                fila.className = "border-b border-gray-200 hover:bg-gray-50 text-center";

                fila.innerHTML = `
                    <td class="p-2 border-r font-bold">${fecha}</td>
                    <td class="p-2 border-r font-semibold">1</td>
                    <td class="p-2 border-r">10:00 a. m.</td>
                    <td class="p-2 border-r">11:30 a. m.</td>
                    <td class="p-2 border-r font-semibold text-blue-700">${cantidadPm}</td>
                    <td class="p-2 border-r">11:00 a. m.</td>
                    <td class="p-2 border-r">17:00 p. m.</td>
                    <td class="p-2 border-r">2:00</td>
                    <td class="p-2 border-r">6:00</td>
                    <td class="p-2 border-r">8:00</td>
                `;

                tbody.appendChild(fila);
            });
        });
      document.getElementById("btnExportarExcel")?.addEventListener("click", () => {
    const cortes = JSON.parse(localStorage.getItem("control_tiempos")) || [];
    if (cortes.length === 0) {
        alert("No hay registros de producción para exportar.");
        return;
    }

    let registrosPorFecha = {};

    cortes.forEach(corte => {
        let fechaLimpia = corte.fechaTurno ? corte.fechaTurno.split(' - ')[0] : "";
        if (!fechaLimpia) return;
        let turno = corte.turno || (corte.fechaTurno && corte.fechaTurno.includes('PM') ? 'PM' : 'AM');

        if (!registrosPorFecha[fechaLimpia]) {
            registrosPorFecha[fechaLimpia] = { am: 0, pm: 0, folios: 0, hasData: true };
        }

        if (turno === 'AM') {
            registrosPorFecha[fechaLimpia].am += (corte.totalContratos || 1);
        } else {
            registrosPorFecha[fechaLimpia].pm += (corte.totalContratos || 1);
        }
        registrosPorFecha[fechaLimpia].folios += (corte.cantidadFolios || 1);
    });

    // Rellenar automáticamente los días intermedios sin registros en blanco para el Excel
    let fechasKeys = Object.keys(registrosPorFecha);
    if (fechasKeys.length > 0) {
        function parseFecha(str) {
            const partes = str.split('/');
            return new Date(partes[2], partes[1] - 1, partes[0]);
        }
        function formatoFecha(date) {
            let d = String(date.getDate()).padStart(2, '0');
            let m = String(date.getMonth() + 1).padStart(2, '0');
            let y = date.getFullYear();
            return `${d}/${m}/${y}`;
        }

        let fechasDates = fechasKeys.map(f => parseFecha(f));
        let minDate = new Date(Math.min.apply(null, fechasDates));
        let maxDate = new Date(Math.max.apply(null, fechasDates));

        let fechaActual = new Date(minDate);
        while (fechaActual <= maxDate) {
            let fechaStr = formatoFecha(fechaActual);
            if (!registrosPorFecha[fechaStr]) {
                registrosPorFecha[fechaStr] = { am: 0, pm: 0, folios: 0, hasData: false };
            }
            fechaActual.setDate(fechaActual.getDate() + 1);
        }
    }

    // Ordenar cronológicamente
    let fechasOrdenadas = Object.keys(registrosPorFecha).sort((a, b) => {
        let pA = a.split('/'), pB = b.split('/');
        return new Date(pA[2], pA[1]-1, pA[0]) - new Date(pB[2], pB[1]-1, pB[0]);
    });

    // Construir la tabla HTML con estilos directos para Excel (bordes y celdas)
    let htmlTabla = `
        <table border="1" style="border-collapse: collapse; font-family: Arial, sans-serif; font-size: 11px;">
            <thead>
                <tr style="background-color: #f1f5f9; text-align: center;">
                    <th style="border: 1px solid black; padding: 6px;">FECHA / TURNO</th>
                    <th style="border: 1px solid black; padding: 6px;">CANTIDAD</th>
                    <th style="border: 1px solid black; padding: 6px;">HORA INICIO</th>
                    <th style="border: 1px solid black; padding: 6px;">HORA FIN</th>
                    <th style="border: 1px solid black; padding: 6px;">CANTIDAD</th>
                    <th style="border: 1px solid black; padding: 6px;">HORA INICIO</th>
                    <th style="border: 1px solid black; padding: 6px;">HORA FIN</th>
                    <th style="border: 1px solid black; padding: 6px;">HORAS POR...</th>
                    <th style="border: 1px solid black; padding: 6px;">HORAS POR...</th>
                    <th style="border: 1px solid black; padding: 6px;">TOTAL HORA</th>
                </tr>
            </thead>
            <tbody>
    `;

    fechasOrdenadas.forEach(fecha => {
        let datos = registrosPorFecha[fecha];
        if (datos.hasData) {
            let cantidadPm = datos.pm > 0 ? datos.pm : (datos.am > 1 ? datos.am : 1);
            let totalSuma = 1 + cantidadPm;

            htmlTabla += `
                <tr style="text-align: center;">
                    <td style="border: 1px solid black; padding: 6px; font-weight: bold;">${fecha}</td>
                    <td style="border: 1px solid black; padding: 6px;">1</td>
                    <td style="border: 1px solid black; padding: 6px;">10:00 a. m.</td>
                    <td style="border: 1px solid black; padding: 6px;">11:30 a. m.</td>
                    <td style="border: 1px solid black; padding: 6px;">${cantidadPm}</td>
                    <td style="border: 1px solid black; padding: 6px;">11:00 a. m.</td>
                    <td style="border: 1px solid black; padding: 6px;">17:00 p. m.</td>
                    <td style="border: 1px solid black; padding: 6px;">8:00</td>
                    <td style="border: 1px solid black; padding: 6px;">8:00</td>
                    <td style="border: 1px solid black; padding: 6px; font-weight: bold;">${totalSuma} Contratos</td>
                </tr>
            `;
        } else {
            // Día sin registro: se deja la fecha y los espacios en blanco pintados con sus casillas
            htmlTabla += `
                <tr style="text-align: center;">
                    <td style="border: 1px solid black; padding: 6px; font-weight: bold;">${fecha}</td>
                    <td style="border: 1px solid black; padding: 6px;"></td>
                    <td style="border: 1px solid black; padding: 6px;"></td>
                    <td style="border: 1px solid black; padding: 6px;"></td>
                    <td style="border: 1px solid black; padding: 6px;"></td>
                    <td style="border: 1px solid black; padding: 6px;"></td>
                    <td style="border: 1px solid black; padding: 6px;"></td>
                    <td style="border: 1px solid black; padding: 6px;"></td>
                    <td style="border: 1px solid black; padding: 6px;"></td>
                    <td style="border: 1px solid black; padding: 6px;"></td>
                </tr>
            `;
        }
    });

    htmlTabla += `</tbody></table>`;

    // Generar y descargar el archivo .xls
    let archivoBlob = new Blob([
        '\ufeff' + '<html><head><meta charset="utf-8"></head><body>' + htmlTabla + '</body></html>'
    ], { type: 'application/vnd.ms-excel;charset=utf-8;' });

    let enlaceDescarga = document.createElement("a");
    enlaceDescarga.href = window.URL.createObjectURL(archivoBlob);
    enlaceDescarga.download = `Control_Tiempos_${new Date().toLocaleDateString().replace(/\//g, '-')}.xls`;
    
    document.body.appendChild(enlaceDescarga);
    enlaceDescarga.click();
    document.body.removeChild(enlaceDescarga);
});
    </script>
</body>

</html>
